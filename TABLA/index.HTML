<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis primeras tablas</title>
    <style>
        table, td, tr, th{
            border: 2px solid blueviolet;
            border-collapse: collapse
        }
    </style>
</head>
<body>

    <br>
    <table>
        <tr>    
            <th>Posicion</th>
            <th>Nombre</th>
            <th>Nota</th>

            <td rowspan="2">1º</td>
            <td>Juan</td>
            <td>9</td>
        </tr>
        <tr>

            <td>8</td>
        </tr>
    </table>
<br>
    <table>
        <tr>
            <th>Posición</th>
            <th>Nombre</th>
            <th>Nota</th>
        </tr>

            <td>1º</td>

        </tr>
        <tr>
            <td>2º</td>
            <td>Iván Martínez</td>

<br>

        <tr>

                    <tr>
                        <th>1</th>

                        <th>1</th>
                    </tr>
                    <tr>
                        <td>1</td>
                        <td>1</td>
                        <td>1</td>
                    </tr>
                    <tr>
                        <td>1</td>
                        <td>1</td>
                        <td>1</td>
                    </tr>
                </table>
            </th>
        </tr>

        <tr>
            <th>1</th>
            <th>1</th>
        </tr>
    </table>

</html>
