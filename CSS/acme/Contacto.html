    <!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>ACME Corporation – Contacto</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 40px auto;
            padding: 0 20px;
            color: #222;
        }
        h1 {
            border-bottom: 3px solid #c0392b;
            padding-bottom: 10px;
        }
        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin: 20px 0;
        }
        .info-block {
            background: #f9f9f9;
            padding: 15px;
            border-left: 4px solid #c0392b;
        }
        .info-block h3 {
            margin-top: 0;
        }
        form label {
            display: block;
            margin-top: 12px;
            font-weight: bold;
        }
        form input,
        form textarea,
        form select {
            width: 100%;
            padding: 8px;
            margin-top: 4px;
            box-sizing: border-box;
        }
        form button {
            margin-top: 16px;
            padding: 10px 24px;
            background: #c0392b;
            color: #fff;
            border: none;
            cursor: pointer;
        }
        form button:hover {
            background: #a93226;
        }
        footer {
            margin-top: 40px;
            font-size: 0.85em;
            color: #666;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        header {
            background-color: #333;
            color: #fff;
            padding: 10px 20px;
        }

        nav ul {
            list-style-type: none;
            margin: 0;
            padding: 0;
            display: flex;
        }

        nav ul li {
            margin-right: 20px;
        }

        nav ul li a {
            color: #fff;
            text-decoration: none;
        }

        nav ul li a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <header>
        <nav>
            <ul>
                <li class="menuitem"> <a href="Inicio.html">Inicio</a> </li>
                <li class="menuitem"> <a href="Ubicacion.html">Ubicación</a> </li>
                <li class="menuitem"> <a href="Contacto.html">Contacto</a> </li>
                <li class="menuitem"> <a href="Equipo.html">Equipo</a> </li>
            </ul>
        </nav>
    </header>
    <h1>ACME Corporation – Contacto</h1>
    <h2>Formulario de contacto</h2>
    <form action="#" method="post">
        <label for="nombre" placeholder="Tu nombre completo">Nombre completo</label>
        <input type="text" id="nombre" name="nombre" required>

        <label for="email" placeholder="tu.email@acme-corp.com">Correo electrónico</label>
        <input type="email" id="email" name="email" required>

        <label for="telefono" placeholder="123-456-7890">Teléfono (opcional)</label>
        <input type="tel" id="telefono" name="telefono">

        <label for="asunto">Asunto</label>
        <select id="asunto" name="asunto">
            <option value="ventas">Solicitud de venta</option>
            <option value="soporte">Soporte técnico</option>
            <option value="prensa">Prensa / Medios</option>
            <option value="reclamo">Reclamo o incidencia</option>
            <option value="otro">Otro</option>
        </select>

        <label for="mensaje">Mensaje</label>
        <textarea id="mensaje" name="mensaje" rows="5" required></textarea>

        <button type="submit">Enviar mensaje</button>
    </form>

    <footer>
        <p><em> 2026 ACME Corporation. Todos los derechos reservados.</p>
        <p><em>"La fuerza que impulsa el mundo."</em></p>
    </footer>  
</body>
</html>
