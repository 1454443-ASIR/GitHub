<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <title>ACME Corporation – Equipo</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        header {
            background-color: #333;
            color: #fff;
            padding: 10px 20px;
        }

        nav ul {
            list-style-type: none;
            margin: 0;
            padding: 0;
            display: flex;
        }

        nav ul li {
            margin-right: 20px;
        }

        nav ul li a {
            color: #fff;
            text-decoration: none;
        }

        nav ul li a:hover {
            text-decoration: underline;
        }

        main {
            max-width: 1000px;
            margin: 40px auto;
            padding: 0 20px;
        }

        h1 {
            border-bottom: 3px solid #c0392b;
            padding-bottom: 10px;
        }

        .team-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 24px;
            margin-top: 24px;
        }

        .team-card {
            border: 1px solid #ddd;
            border-radius: 6px;
            padding: 20px;
            text-align: center;
        }

        .team-card .avatar {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background: #ccc;
            margin: 0 auto 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2em;
            color: #fff;
        }

        .team-card h3 {
            margin: 8px 0 4px;
        }

        .team-card .cargo {
            color: #c0392b;
            font-weight: bold;
            font-size: 0.9em;
            margin-bottom: 8px;
        }

        .team-card p {
            font-size: 0.9em;
            color: #555;
        }

        footer {
            text-align: center;
            padding: 20px;
            font-size: 0.85em;
            color: #666;
            border-top: 1px solid #ddd;
            margin-top: 40px;
        }
    </style>
</head>
