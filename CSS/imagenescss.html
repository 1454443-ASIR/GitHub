<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Centrando imágenes</title>

    <style>
        img[src="imagenes/SW.png"]{
            display:block;
            margin: 0 auto;
            height: 200px;
            position: fixed;
            right: 20px
        }

        img[src="imagenes/imagen2.jpg"]{
            display:block;
            margin: 20px auto;
            height: 100px;
            position:absolute;
            bottom: 20px;
            border: 20px solid black;

        }

        img[src="imagenes/imagen3.jpg"]{
            display: block;
            margin-left: auto;
            margin-right: auto;
            height: 200px;
        }

        img[src="imagenes/imagen4vertical.jpg"]{
            position: absolute;
            top: 50%;
            left: 50%;
            height: 200px
        }
    </style>
</head>
<body>
    <img src="imagenes/SW.png">
    <img src="imagenes/imagen2.jpg">
    <img src="imagenes/imagen3.jpg">
    <img src="imagenes/imagen4vertical.jpg">

</body>
</html>
