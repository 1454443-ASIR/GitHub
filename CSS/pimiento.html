<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Introducción a CSS</title>
    <style>
        p{
            font-size: 2em
        }
        .parrafo-azul{
            color: rgb(0, 0, 255);
            font-family: sans-serif;
            font-weight: bold;
        }
        .parrafo-verde{
            color: rgb(0, 255, 0);
            font-family: Verdana, Geneva, Tahoma, sans-serif
        }
        .parrafo-amarillo, h1{
            color: #ff0;
            font-family: serif
        }
    </style>
</head>
<body>
    <h1>Empezando con CSS</h1>
    <p class="parrafo-azul">Este es un párrafo azul.</p>
    <p class="parrafo-amarillo">Este es un párrafo amarillo.</p>
    <p class="parrafo-verde">Este es un párrafo verde.</p>

    <div style="border: 5px; color: red ;padding: 20px; margin: 50px">primer bloque</div>
</body>
</html>
