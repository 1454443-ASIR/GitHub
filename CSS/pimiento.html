<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Introducción a CSS</title>
    <style>
        .parrafo-azul{
            color: rgb(0, 0, 255);
        }
        .parrafo-verde{
            color: rgb(0, 255, 0);
        }
        .parrafo-amarillo, h1{
            color: #ff0;
        }
    </style>
</head>
<body>
    <h1>Empezando con CSS</h1>
    <p class="parrafo-azul">Este es un párrafo azul.</p>
    <p class="parrafo-amarillo">Este es un párrafo amarillo.</p>
    <p class="parrafo-verde">Este es un párrafo verde.</p>
</body>
</html>
