<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Extraordinaria</title>

    <style>
        p{
            font-size: 16px;
        }

        div{
            border: 2px solid blue;
        }

        h1{
            color: blue;
        }

        h2{
            color: green;
        }

        body{
            background-image: url(img/texturapapel.jpg);
        }

        table,td,th{
            border: 1px solid black;

        }
    </style>
</head>
<body>
    <h1>Este es mi examen</h1>
    <p> <a href="http://www.vedoque.com/">Esta es una buena página </a></p>
    <figure>
        <img src="img/paisaje.jpg" height="100">
        <figcaption>Esta es una gran imagen</figcaption>
    </figure>
    <h2 style="background-color: white">
        El examen está siendo fácil
    </h2>
    <p>No esperaba que fuera tan fácil</p>
    <table>
        <tr>
            <th>Nombre</th>
            <th>Nota</th>
        </tr>
        <tr>
            <td>Juan</td>
            <td>8</td>
        </tr>
        <tr>
            <td>María</td>
            <td>9</td>
        </tr>
        <tr>
            <td>Pepe</td>
            <td>10</td>
        </tr>
    </table>
</body>

<footer>Hoy si que voy a aprobar</footer>
<form>
  <label for="nombre">Nombre:</label>
  <input type="text" id="nombre" name="nombre">
</form>

<form>
  <label for="ciclo">Ciclo:</label>
  <select id="ciclo" name="ciclo">
    <option value="asir">ASIR</option>
    <option value="dam">DAM</option>
    <option value="daw">DAW</option>
  </select>

  <fieldset>
    <legend>Curso:</legend>
    <label><input type="radio" name="curso" value="1"> 1º</label>
    <label><input type="radio" name="curso" value="2"> 2º</label>
  </fieldset>

  <fieldset>
    <legend>Estudios previos:</legend>
    <label><input type="checkbox" name="bachillerato" value="bachillerato"> Bachillerato</label>
    <label><input type="checkbox" name="smr" value="smr"> SMR</label>
  </fieldset>
</form>   
</html>
